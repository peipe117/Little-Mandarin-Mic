      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const ctx = audioCtx;
      const osc = ctx.createOscillator();

      osc.connect(gain); gain.connect(ctx.destination);
      if (type === 'level-clear') { osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15); osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.3); osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.45); gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.8); osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.8);

          });

          rawData.forEach(record => {
            if (!userGroups[record.name]) userGroups[record.name] = [];
            userGroups[record.name].push(record);
          });

          const aggregatedData = [];
          Object.keys(userGroups).forEach(name => {
            const records = userGroups[name];
            
            const uniqueDates = new Set(records.map(r => new Date(r.timestamp).toLocaleDateString('zh-TW')));
            const daysCount = uniqueDates.size;
            
            const totalTries = records.length; 
            
            records.sort((a, b) => b.timestamp - a.timestamp);
            const latestRecord = records[0];
            const lastUpdateStr = new Date(latestRecord.timestamp).toLocaleString('zh-TW', {
              month: 'numeric', day: 'numeric', hour: '2-digit', minute:'2-digit'
            });

            records.sort((a, b) => {
              if (b.score !== a.score) return b.score - a.score;
              if ((a.attempts || 999) !== (b.attempts || 999)) return (a.attempts || 999) - (b.attempts || 999);
              return b.timestamp - a.timestamp;
            });
            const bestRecord = records[0];

            if (latestRecord.id === bestRecord.id) {
              aggregatedData.push({
                id: bestRecord.id,
                name: name,
                avatar: bestRecord.avatar || '👤',
                bestScore: bestRecord.score,
                daysCount: daysCount,
                totalTries: totalTries,
                lastUpdate: lastUpdateStr,
                lastTimestamp: latestRecord.timestamp

      const startRecording = () => {

      const evaluateSpeech = () => {
        const cleanTarget = removePunctuation(targetSentenceObj.text);
        const cleanRecognized = normalizeNumbers(removePunctuation(recognizedText));
        
        if (cleanRecognized.length === 0) return;
        
        setTotalAttempts(prev => prev + 1);

        let matchedChars = [];
        let correctCount = 0;
        let tempRecognized = cleanRecognized;
        
        for (let i = 0; i < targetSentenceObj.text.length; i++) {
          const char = targetSentenceObj.text[i];
          const zhuyin = targetSentenceObj.zhuyin[i];
          const pinyin = targetSentenceObj.pinyin[i];
          const isPunc = /[，。、！？；：「」『』\s]/.test(char);

          if (isPunc) {
              matchedChars.push({ char, zhuyin, pinyin, isPunc, isCorrect: true });
          } else {
            let matchIndex = tempRecognized.indexOf(char);
            if (matchIndex === -1 && HOMOPHONE_ALIASES[char]) {
                for (let alias of HOMOPHONE_ALIASES[char]) {
                    matchIndex = tempRecognized.indexOf(alias);
                    if (matchIndex !== -1) break;
                }
            }

            if (matchIndex !== -1) { 
                matchedChars.push({ char, zhuyin, pinyin, isPunc, isCorrect: true }); 
                correctCount++; 
                tempRecognized = tempRecognized.substring(0, matchIndex) + tempRecognized.substring(matchIndex + 1);
            } else {
                matchedChars.push({ char, zhuyin, pinyin, isPunc, isCorrect: false });
            }
          }
        }

        const accuracy = correctCount / cleanTarget.length;
        
        let stars = 0;
        if (accuracy === 1) stars = 3;      
        else if (accuracy >= 0.6) stars = 2; 
        else if (accuracy >= 0.3) stars = 1; 

        const currentIsSightReading = phoneticMode === 'none' && !hasUsedHint;

        if (stars > 0 && currentIsSightReading) {

            setComboCount(0);

        }

                  })}
                  <div className="absolute top-1/2 z-50" style={{ left: `${progressPercentage}%`, transform: 'translate(-50%, -50%)', zIndex: isFlyingAway ? 9999 : 50, ...springTransition }}>
                    <div className="transition-all duration-1000 origin-center drop-shadow-lg text-3xl sm:text-4xl" style={ isFlyingAway ? { animation: 'flyAwayCenter 3s ease-in-out forwards' } : { transform: effectiveProgress === totalSentences ? 'scale(1.5)' : `scaleX(-${1 + effectiveProgress * 0.15}) scaleY(${1 + effectiveProgress * 0.15})`, animation: effectiveProgress === totalSentences ? 'fly 2s infinite alternate ease-in-out' : 'none' }}>{effectiveProgress === totalSentences ? '🏆' : selectedAvatar}</div>
                  </div>
                </div>
                <div className="text-green-500 font-bold mt-5 tracking-widest text-xs sm:text-sm bg-green-50 inline-block px-4 py-1.5 rounded-full">{t.progress} {effectiveProgress} / {totalSentences}</div>
              </div>
              <div className="mt-2 sm:mt-4 mb-6 sm:mb-12 relative flex-1 flex flex-col justify-center z-10">
                <div className="flex justify-center items-center gap-2 sm:gap-3 mb-6 sm:mb-10 flex-wrap w-full">
                  <div className="flex items-center justify-center text-sm sm:text-base text-gray-500 font-medium tracking-widest bg-gray-50 px-4 sm:px-5 py-2 sm:py-2.5 rounded-full border-2 border-gray-100 shadow-sm">
                    {t.readAloud}
                  </div>
                  <div className="flex items-center justify-center text-sm sm:text-base text-orange-500 font-medium bg-orange-50 px-4 sm:px-5 py-2 sm:py-2.5 rounded-full border-2 border-orange-100 animate-pulse shadow-sm">
                    {t.clickToHear}
                  </div>
                  {!result && (
                    <button onClick={handleTeacherHelp} className="flex items-center justify-center gap-1.5 sm:gap-2 bg-white text-blue-500 px-4 sm:px-5 py-2 sm:py-2.5 rounded-full text-sm sm:text-base font-medium transition-all shadow-[0_4px_0_0_#bfdbfe] hover:translate-y-[-2px] hover:shadow-[0_6px_0_0_#bfdbfe] active:translate-y-[4px] active:shadow-none border-2 border-blue-200">
                      <HelpCircle className="w-4 h-4 sm:w-5 sm:h-5" /> {t.teacherHelp}
                    </button>
                  )}
                </div>
                <div className="text-[1.8rem] sm:text-4xl md:text-5xl font-normal text-gray-800 leading-[2.8rem] sm:leading-[4.5rem] flex flex-wrap justify-center items-end min-h-[100px] sm:min-h-[140px]">
                  {result ? result.matchedChars.map((item, idx) => (
                    <ruby key={idx} className="mx-[4px] sm:mx-[6px] transition-all duration-300 transform hover:scale-110">
                      <span className={`${item.isPunc ? 'text-gray-400' : (item.isCorrect ? 'text-green-500 drop-shadow-sm' : 'text-red-500 opacity-80')}`}>{item.char}</span>
                      {phoneticMode === 'zhuyin' && !item.isPunc && (<rt className={`text-base sm:text-xl font-normal font-sans tracking-tighter mb-1 sm:mb-2 ${item.isCorrect ? 'text-green-500' : 'text-red-400'}`}>{item.zhuyin}</rt>)}
                      {phoneticMode === 'pinyin' && !item.isPunc && (<rt className={`text-sm sm:text-base font-normal font-sans tracking-tighter mb-1 sm:mb-2 ${item.isCorrect ? 'text-green-500' : 'text-red-400'}`}>{item.pinyin}</rt>)}
                    </ruby>
                  )) : targetSentenceObj.text.split('').map((char, idx) => {
                    const zhuyin = targetSentenceObj.zhuyin[idx]; 
                    const pinyin = targetSentenceObj.pinyin[idx]; 
                    const isPunc = /[，。、！？；：「」『』\s]/.test(char);
                    return (
                      <ruby key={idx} onClick={() => playSingleCharSpeech(char)} className={`mx-[4px] sm:mx-[6px] transition-all duration-300 ${!isPunc ? 'cursor-pointer hover:bg-orange-100 rounded-xl p-1 sm:p-2 group active:scale-95' : ''}`} title={!isPunc ? t.clickToHearMobile : ''}>
                        <span className={isPunc ? "text-gray-400" : "text-gray-800 group-hover:text-orange-500"}>{char}</span>
                        {phoneticMode === 'zhuyin' && !isPunc && (<rt className="text-base sm:text-xl text-orange-500 font-normal font-sans tracking-tighter mb-1 sm:mb-2">{zhuyin}</rt>)}
                        {phoneticMode === 'pinyin' && !isPunc && (<rt className="text-sm sm:text-base text-blue-500 font-normal font-sans tracking-tighter mb-1 sm:mb-2">{pinyin}</rt>)}
                      </ruby>
                    );
                  })}
                </div>
              </div>
              <div className="flex flex-col items-center justify-center gap-5 sm:gap-8 relative z-10 mt-auto shrink-0 mb-4 sm:mb-0">
                <button onClick={isRecording ? stopRecording : startRecording} disabled={isFlyingAway} className={`relative w-24 h-24 sm:w-32 sm:h-32 rounded-full flex items-center justify-center transition-all duration-300 z-10 border-[6px] border-white ${isRecording ? 'bg-red-400 recording-glow scale-110' : 'bg-gradient-to-b from-orange-300 to-orange-500 shadow-[0_8px_0_0_#ea580c] hover:translate-y-[-2px]'}`}>{isRecording ? (<Square className="w-10 h-10 sm:w-14 sm:h-14 text-white animate-pulse" fill="currentColor" />) : (<Mic className={`w-12 h-12 sm:w-16 sm:h-16 text-white transition-transform ${isHoveringMic ? 'scale-110 rotate-6' : ''}`} />)}</button>
                <div className="h-8 sm:h-10">{isRecording ? (<p className="text-white font-medium tracking-wider animate-pulse text-sm sm:text-lg bg-red-400 px-5 sm:px-6 py-2 rounded-full shadow-sm">{t.listening}</p>) : (<p className="text-orange-400 font-medium tracking-widest text-sm sm:text-lg bg-orange-50 px-5 py-2 rounded-full">{t.clickMicToStart}</p>)}</div>
              </div>
              <div className={`mt-6 sm:mt-10 transition-all duration-500 shrink-0 relative z-10 ${recognizedText ? 'opacity-100 h-auto mb-4' : 'opacity-0 h-0 overflow-hidden'}`}><div className="relative min-h-[70px] sm:min-h-[90px] bg-orange-50 rounded-[2rem] p-5 sm:p-8 border-4 border-white shadow-md mx-4 sm:mx-10 mt-4"><div className="absolute -top-4 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[15px] border-r-[15px] border-b-[20px] border-l-transparent border-r-transparent border-b-white drop-shadow-sm"></div><div className="absolute -top-4 left-1/2 -translate-x-1/2 bg-orange-400 text-white px-3 sm:px-4 py-1 text-xs font-bold tracking-widest rounded-full z-10">{t.micHeard}</div><p className="text-xl sm:text-3xl font-normal text-orange-600 leading-relaxed">{recognizedText}</p></div></div>
            </div>
          </main>

          {/* 🌟 獨立彈出的星星結算畫面 (已改為置中顯示) */}
          {result && !isRecording && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-gray-900/20 transition-opacity duration-300">
              <div className="bg-white/95 backdrop-blur-none rounded-[2.5rem] p-6 sm:p-8 max-w-md w-full text-center shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] animate-fade-in-up border-[6px] sm:border-[8px] border-white relative">
                <div className="absolute -top-8 left-1/2 -translate-x-1/2 bg-yellow-100 p-3 rounded-full border-4 border-white shadow-md animate-gentle-bounce">
                  <Star className="w-8 h-8 text-yellow-500 fill-yellow-500" />
                </div>
                <div className="flex justify-center gap-3 sm:gap-5 mb-4 sm:mb-6 mt-4 sm:mt-2">
                  {[1, 2, 3].map((star) => (
                    <div key={star} className={`transition-all duration-500 transform ${star <= result.stars ? 'scale-110' : 'scale-90 opacity-40'}`}>
                      <Star className={`w-12 h-12 sm:w-16 sm:h-16 ${star <= result.stars ? 'text-yellow-400 fill-yellow-400 drop-shadow-md' : 'text-gray-300'}`} />
                    </div>
                  ))}
                </div>
                <p className={`text-xl sm:text-2xl font-bold mb-6 sm:mb-8 px-2 ${result.stars === 3 ? 'text-green-500' : 'text-orange-500'}`}>
                  {needsHanziChallenge ? t.requireSightReadingMsg : (result.stars === 3 ? t.perfect : result.stars === 2 ? t.good : t.tryAgainMsg)}
                </p>
                <div className="flex flex-col sm:flex-row justify-center gap-2 sm:gap-4 px-1 sm:px-0">
                  {needsHanziChallenge ? (
                    <button onClick={handleSightReadingRetry} className="flex-1 flex items-center justify-center gap-1.5 sm:gap-2 px-3 sm:px-6 py-4 bg-gradient-to-b from-purple-400 to-purple-500 text-white rounded-full font-bold transition-all text-sm sm:text-xl whitespace-nowrap shadow-[0_4px_0_0_#9333ea] hover:translate-y-[-2px]">
                      <RefreshCw className="w-4 h-4 sm:w-6 sm:h-6" /> {t.challengeHanzi}
                    </button>
                  ) : (
                    <React.Fragment>
                      <button onClick={startRecording} disabled={isFlyingAway} className="flex-1 flex items-center justify-center gap-1.5 sm:gap-2 px-3 sm:px-6 py-4 bg-white text-gray-500 rounded-full font-medium transition-all text-sm sm:text-xl whitespace-nowrap shadow-[0_4px_0_0_#e5e7eb] hover:translate-y-[-2px] border-2 border-gray-100 disabled:opacity-50">
                        <RefreshCw className="w-4 h-4 sm:w-6 sm:h-6" /> {t.tryAgainBtn}
                      </button>
                      {currentSentenceIndex < totalSentences - 1 ? (
                        <button onClick={handleNext} className="flex-1 flex items-center justify-center gap-1.5 sm:gap-2 px-3 sm:px-6 py-4 bg-gradient-to-b from-green-400 to-green-500 text-white rounded-full font-medium transition-all text-sm sm:text-xl whitespace-nowrap shadow-[0_4px_0_0_#16a34a] hover:translate-y-[-2px]">
                          <Play className="w-4 h-4 sm:w-6 sm:h-6" fill="currentColor" /> {t.nextSentence}
                        </button>
                      ) : (
                        <button onClick={finishLesson} disabled={isFlyingAway} className="flex-1 flex items-center justify-center gap-1.5 sm:gap-2 px-3 sm:px-6 py-4 bg-gradient-to-b from-yellow-400 to-orange-400 text-white rounded-full font-medium transition-all text-sm sm:text-xl whitespace-nowrap shadow-[0_4px_0_0_#ea580c] hover:translate-y-[-2px] animate-bounce">
                          <Award className="w-4 h-4 sm:w-6 sm:h-6" fill="currentColor" /> {t.finishLevel}
                        </button>
                      )}
                    </React.Fragment>
                  )}
                </div>
              </div>
            </div>
          )}
          
          {showLeaderboard && <LeaderboardModal />}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
